name = "bilauitmcuti-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
send_metrics = false

routes = [
  { pattern = "mcp.bilauitmcuti.com", zone_name = "bilauitmcuti.com", custom_domain = true },
]

[vars]
MCP_API_BASE_URL = "https://api.bilauitmcuti.com"
DOCS_BASE_URL = "https://docs.bilauitmcuti.com"
BETTER_AUTH_URL = "https://mcp.bilauitmcuti.com"

[[d1_databases]]
binding = "DB"
database_name = "bilauitmcuti-auth"
database_id = "d2588c1d-1fe9-4318-9bec-5199f09c9eb5"
migrations_dir = "migrations"

[observability]
enabled = true

[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "STANDARD_RATE_LIMIT"
namespace_id = "2002"
simple = { limit = 10, period = 10 }
